name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      only:
        description: "Run a single matrix job (or 'all')"
        required: true
        default: "all"
        type: choice
        options: [all, linux-x64, linux-arm64, macos-arm64, macos-x64, windows-x64]

# tree-sitter upstream is portable C and the vendored lmcode-cpp SDK is
# standard-library-only C++17 with _WIN32 paths, so the matrix covers Linux,
# macOS, and Windows (MinGW). Every main push updates the rolling `dist`
# branch; pushing a v* tag additionally cuts a GitHub Release with the same
# five tested binaries.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04,     name: linux-x64 }
          - { os: ubuntu-24.04-arm, name: linux-arm64 }
          - { os: macos-15,         name: macos-arm64 }
          - { os: macos-15-intel,   name: macos-x64 }
          - { os: windows-2022,     name: windows-x64 }
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    env:
      ONLY_OK: ${{ github.event_name != 'workflow_dispatch' || inputs.only == 'all' || matrix.name == inputs.only }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: env.ONLY_OK == 'true'
        with:
          persist-credentials: false

      - name: sync deps (deps.lock) and verify vendored sdk headers
        if: env.ONLY_OK == 'true'
        run: |
          scripts/sync-deps.sh
          scripts/sync-sdk.sh --verify

      - name: toolchain (linux)
        if: runner.os == 'Linux' && env.ONLY_OK == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build

      - name: toolchain (macos)
        if: runner.os == 'macOS' && env.ONLY_OK == 'true'
        run: brew install ninja coreutils

      - name: toolchain (windows)
        if: runner.os == 'Windows' && env.ONLY_OK == 'true'
        run: |
          for i in 1 2 3; do
            command -v g++ >/dev/null 2>&1 && command -v ninja >/dev/null 2>&1 && break
            choco install -y mingw ninja && break || sleep 15
          done
          command -v g++ >/dev/null 2>&1 || exit 1
          command -v ninja >/dev/null 2>&1 || exit 1

      - name: lmscript compiler (npm @lmctl-ai/lmctl, DSL v5)
        if: env.ONLY_OK == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: install and probe the compiler
        if: env.ONLY_OK == 'true'
        shell: bash
        run: |
          npm i -g @lmctl-ai/lmctl@0.2.420
          scripts/select-compiler.sh | tee compiler.txt
          grep -q lmscript compiler.txt || { echo "no v5 compiler available"; exit 1; }

      - name: build and test
        if: env.ONLY_OK == 'true'
        shell: bash
        run: ./test.sh

      - name: package artifact
        if: env.ONLY_OK == 'true'
        shell: bash
        run: |
          mkdir -p dist
          suffix=""; [ "$RUNNER_OS" = Windows ] && suffix=.exe
          cp "build/lmbetter${suffix}" "dist/lmbetter-${{ matrix.name }}${suffix}"
          cp LICENSE THIRD_PARTY_NOTICES.md dist/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: env.ONLY_OK == 'true'
        with:
          name: lmbetter-${{ matrix.name }}
          path: dist/
          if-no-files-found: error

  # Push-and-publish: on every main push (and full manual re-runs) collect
  # the matrix binaries and force-update the rolling `dist` branch, so the
  # latest per-OS executables live at permanent URLs. No approval, no
  # release object; the branch head is always "the latest main build".
  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    permissions:
      contents: write # push to the dist branch
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: lmbetter-*
          path: ${{ runner.temp }}/bins
          merge-multiple: true

      - name: checksums
        run: (cd "${{ runner.temp }}/bins" && sha256sum lmbetter-* > SHA256SUMS)

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: true # the token must land in .git/config for the push
          fetch-depth: 1

      - name: update the dist branch
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch --depth=1 origin dist && git rev-parse -q --verify FETCH_HEAD; then
            git checkout -B dist FETCH_HEAD
          else
            git checkout --orphan dist
          fi
          git rm -rf . >/dev/null 2>&1 || true
          cp "${{ runner.temp }}/bins"/lmbetter-* "${{ runner.temp }}/bins"/SHA256SUMS .
          cp LICENSE THIRD_PARTY_NOTICES.md . 2>/dev/null || true
          git add -A
          if git diff --cached --quiet; then
            echo "dist branch already up to date"
          else
            git commit -m "dist: lmbetter binaries from ${GITHUB_SHA}"
          fi
          git push --force-with-lease origin dist

  # Tag a commit v* and the same five tested binaries become a GitHub Release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: lmbetter-*
          path: dist
          merge-multiple: true

      - name: Check five release assets and checksums
        run: |
          test "$(find dist -maxdepth 1 -type f -name 'lmbetter-*' | wc -l)" -eq 5
          (cd dist && sha256sum lmbetter-* > SHA256SUMS)

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already published; preserving its verified assets and checksums."
          else
            gh release create "$GITHUB_REF_NAME" dist/lmbetter-* dist/SHA256SUMS \
              --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
              --notes "Five tested platform binaries (Linux x64/arm64, macOS arm64/x64, Windows x64) plus SHA256SUMS. Rolling latest-main builds live on the dist branch."
          fi
